      (2026-07-21, incluido Reunionesdegrupo.zip) — consistente con que
      Simulacros.zip fue reempaquetado después y en ese reempaquetado se
      incluyó por error una copia completa de otro ZIP ya existente.
    confidence: high
    evidence_status: conflicting
    mapping_presence: unknown
    limitations:
