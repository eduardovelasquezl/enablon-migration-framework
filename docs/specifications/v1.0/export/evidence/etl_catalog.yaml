# Catálogo de workbooks ETL — Bloque1_ETL/
#
# Documental, no ejecutable. Producto del análisis en modo solo lectura de
# los 10 workbooks de inputs/_incoming_claude_web/Bloque1_ETL/ (ver
# etl_evidence_assessment.md para el método y las limitaciones completas).
# Ningún archivo original fue modificado, recalculado, guardado ni
# macro-ejecutado. Prioridad analítica: ETL_BCM_Simulacros_UpdateEje_SITECAN.xlsx
# (simulacros.Drills), analizado en profundidad; el resto, analizado
# estructuralmente y mediante su propia hoja "Index" autodescriptiva.
#
# No se han copiado a este catálogo valores de columnas con datos
# personales (nombres de empleados, emails, teléfonos) — donde aparecen en
# el workbook, se referencian solo por nombre de columna y recuento de
# filas, nunca por valor.
#
# Actualización (incremento de validación de Reference / análisis profundo
# ETL / Action Plans cuantitativo): se profundizó más allá de la hoja
# Index en 3 hojas representativas de cada uno de los 9 workbooks restantes
# (27 hojas adicionales) — ver etl_deep_analysis.md para el detalle
# completo. Los 9 workbooks permanecen `partially_reviewed` (siguen sin
# lectura exhaustiva fila a fila) pero con mayor profundidad de evidencia
# que en el incremento anterior. Se añaden nuevas entradas en
# `transformations` con los hallazgos cruzados entre workbooks (mecanismo
# de resolución de entidad repetido, reglas confirmadas por comentario del
# autor, convención "//"). Ver también evidence/etl_sheet_catalog.yaml
# (taxonomía completa de las 655 hojas de los 10 workbooks).

