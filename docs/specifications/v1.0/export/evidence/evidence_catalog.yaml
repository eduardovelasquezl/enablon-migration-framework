# Catálogo de evidencias — Export Specifications v1.0
#
# Documental en este incremento (no se consume todavía por ningún motor).
# Todo evidence_id es determinista: se deriva de la ruta del artefacto, nunca
# de un contador arbitrario. No contiene secretos, contraseñas, cadenas de
# conexión ni datos personales — donde el artefacto original sí los contiene
# (ver `limitations`), el catálogo referencia el archivo sin citar su contenido.
#
# Taxonomía de evidence_type: enablon_template | validated_output_csv |
#   source_sql | etl_definition | mapping_definition | enablon_configuration |
#   official_documentation | approved_functional_decision | client_rule |
#   automated_test | architecture_documentation | unknown
#
# Estados: identified | partially_reviewed | validated | conflicting |
#   obsolete | evidence_pending
# Confianza: high | medium | low | unknown

