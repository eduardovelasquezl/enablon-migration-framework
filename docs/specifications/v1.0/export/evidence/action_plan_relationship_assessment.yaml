# Evaluación cuantitativa de relaciones de Action Plans
#
# Documental, no ejecutable. Calculado sobre el CSV real
# inputs/_incoming_claude_web/Bloque4_CSV_Enablon/Action Plans-20072026-41.csv
# (31444 filas de datos, tab-delimited UTF-16LE) mediante lectura directa en
# modo solo lectura — ningún identificador histórico completo se reproduce
# aquí; todos los ejemplos usan hash SHA-256 truncado a 10 caracteres. No se
# ha modificado ningún archivo, ni implementado is_legitimate_grouping()
# como función ejecutable — esto es una evaluación documental equivalente.
#
# Metodología de "padre": clave compuesta (CS_HistoricalDataOrigin,
# CS_HistoricalOriginID) — NO solo CS_HistoricalOriginID — para no repetir
# el mismo punto ciego de origen (Hallazgo #1) en esta agregación.

