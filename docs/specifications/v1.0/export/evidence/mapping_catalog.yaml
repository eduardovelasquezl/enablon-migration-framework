# Catálogo de mappings — Bloque2_Mappings_SQL_ENA/
#
# Documental, no ejecutable. Resultado del análisis descrito en
# mapping_evidence_assessment.md: los 9 ZIP de Bloque2_Mappings_SQL_ENA/ NO
# contienen ningún mapping de campo, entidad o relación — contienen copias
# (algunas bit a bit idénticas) de las queries SQL de extracción ya
# catalogadas como `source_sql` en evidence_catalog.yaml. Por eso cada
# entrada de este catálogo documenta la AUSENCIA confirmada de mapping en su
# ZIP de origen, en vez de inventar una decisión que el archivo no contiene
# (instrucción explícita de la Tarea 4 del incremento que produjo este
# catálogo). No contiene datos sensibles ni rutas absolutas de máquina.
#
# Campo `mapping_presence` (añadido en el incremento de evidencia ETL/Bloque1
# y Bloque3, de forma retrocompatible — no se ha eliminado ni reinterpretado
# ninguna entrada histórica): documenta si la evidencia CONFIRMA presencia
# (`present`), ausencia (`absent`) o queda sin determinar (`unknown`) de
# mapping real. Las 9 entradas `no_field_mapping_found` de Bloque2 usan
# `absent` (confirmado, no solo no encontrado por falta de búsqueda). La
# entrada `nested_zip_packaging_anomaly` usa `unknown` porque no evalúa
# presencia de mapping — documenta una anomalía de empaquetado distinta.
# Estas entradas siguen siendo evaluaciones de AUSENCIA de mapping, nunca se
# han convertido en mappings funcionales.

