sixty_three_percent_finding:
  original_figure_pct: 63
  original_methodology_inferred: "naive: 1 - (OriginID distintos / total filas) = redundancia, no proporcion de filas en grupos compartidos"
  recomputed_naive_pct: 62.14
  recomputed_compound_pct: 62.09
  interpretation: >
    El '63%' NO significa 'el 63% de las filas comparten padre con otra' —
    esa proporcion real es 79.01% de las filas (24845 de 31444) en grupos
    con mas de 1 accion. El '63%' es la proporcion de filas 'excedentes' por
    encima de una representante por padre: (filas_en_grupos_compartidos -
    numero_de_grupos_compartidos) / total. Recalculado con clave compuesta
    (sistema+OriginID) el resultado es casi identico (62.09% vs 62.14%
    naive) — la distincion de sistema origen APENAS cambia esta metrica
    concreta, a diferencia de lo que ocurre con la unicidad de
    CS_HistoricalAPID (ver cross_system_collision_apid_count).
  classification_of_63pct:
    legitimate_grouping_candidate_share: "mayoritario — 5227 de 5322 grupos compartidos (98.2%) tienen todos los APID distintos dentro del grupo"
    conflicting_or_duplicate_share: "minoritario — 95 de 5322 grupos compartidos (1.8%) tienen APID repetido dentro del mismo padre"
    unresolved_share: "no aplica a este calculo (solo 1 fila sin OriginID en todo el dataset)"
    standalone_share: "no aplica — el 63% se calcula solo sobre grupos compartidos por definicion"
  conclusion: >
    El 63% (y su cifra hermana, el 79% de filas en agrupacion compartida)
    corresponde MAYORITARIAMENTE a agrupacion legitima uno-a-muchos (varias
    acciones distintas por un mismo registro padre), consistente con el
    patron ya observado directamente en ITP_SIM_ACCIONES_CORRECTORAS
    (multiples IDAccionCorrectora para el mismo IDSimulacro, una fila por
    fase). No se declara "validado" en sentido pleno porque esta
    conclusion se apoya en consistencia estadistica + un mecanismo
    estructural observado (CS_HistoricalAPID separado de
    CS_HistoricalOriginID), no en una confirmacion funcional explicita del
    cliente linea a linea.

methodology_limitations:
  - "CS_HistoricalDataOrigin solo distingue 2 valores (Prevención.ITP_ACCIONES_CORRECTORAS, GCT.CT_ACCIONES) — no permite desglosar por sub-modulo real (idorigenac: eventos_antiguos, simulacros, ops, etc.), ese desglose solo existe en el SQL/ETL de origen, no en el CSV final."
  - "'Action Plans con padre no resoluble' (item 10 de la tarea) no puede cuantificarse desde este CSV: se localizo evidencia de un mensaje de fallo literal ('No se encuentra evento nuevo con ID hist: En eventos de enablon') en una hoja INTERMEDIA del ETL (CSV_AP_EVT_NEW_SPEC), pero ese literal NO aparece en ninguna fila del CSV final entregado (0 de 31444) — sugiere que los casos de fallo se filtraron o corrigieron antes de la entrega final, pero no permite contar cuantos hubo."
  - "No existe en el CSV final ningun campo que indique 'do_not_migrate'/excluido — por definicion, un registro excluido nunca aparece en un export ya cargado; esta categoria no es medible desde este archivo."
  - "El calculo se hizo sobre una unica pasada de lectura, sin cruzar contra los datos de origen SQL/ETL — la clasificacion 'legitimate_one_to_many_candidate' es un CANDIDATO estructural, no una validacion funcional aprobada por el cliente."

