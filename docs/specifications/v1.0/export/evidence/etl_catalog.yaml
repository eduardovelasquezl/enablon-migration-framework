transformations:

  - transformation_id: "etl_transform:simulacros.calculohorasdiasminutos.duration_split"
    workbook_id: "etl_workbook:simulacros.bcm_updateeje"
    sheet_id: "etl_sheet:simulacros.calculohorasdiasminutos"
    source_columns: ["Duracion"]
    target_column: "CS_DurationMonths / CS_DurationDays / CS_DurationHours / CS_DurationMinutes"
    formula: >
      CS_DurationMonths =INT(NUMBERVALUE(C2)/(24*30));
      CS_DurationDays =INT(MOD(NUMBERVALUE(C2),24*30)/24);
      CS_DurationHours =INT(MOD(NUMBERVALUE(C2),24));
      CS_DurationMinutes =MROUND(INT(MOD(NUMBERVALUE(C2),1)*60),5)
    transformation_type: "conversión numérica + redondeo"
    description: >
      Descompone una duración numérica en meses/días/horas/minutos asumiendo
      un mes fijo de 30 días (INT(.../(24*30))) y redondeando los minutos al
      múltiplo de 5 más cercano (MROUND(...,5)). Confirma con evidencia de
      fórmula, no solo de dato, el defecto ya documentado en
      config/modules.yaml:88 ("redondeo a múltiplos de 5 min, mes fijo de 30
      días — pérdida de precisión confirmada").
    confidence: high
    evidence_status: confirmed
    related_evidence_ids: ["evidence:config.modules_yaml"]
    open_question_ids: []

  - transformation_id: "etl_transform:simulacros.charfix.titlefix_wildcard"
    workbook_id: "etl_workbook:simulacros.bcm_updateeje"
    sheet_id: "etl_sheet:simulacros.characterfix"
    source_columns: ["*"]
    target_column: null
    formula: "DatoOrigen=* | DatoDestino=(vacío) | EsCondicion=Sí | ReglaEspecial=titlefix | Parametro=(vacío)"
    transformation_type: "regla de caracteres (patrón DatoOrigen/DatoDestino/EsCondicion/ReglaEspecial/Parametro)"
    description: >
      Aplica la regla 'titlefix' de forma condicional (EsCondicion=Sí) a
      TODOS los campos de texto ('*'), no a un campo específico. Confirma
      que titlefix no es exclusivo de MOC — la misma hoja "CharacterFix"
      con la misma regla existe también en el workbook de Bypass y en el de
      OPS (confirmado por listado de hojas). Sigue sin identificarse el
      motor/proceso que ejecuta 'titlefix' en la práctica (ver
      OQ-GLOBAL-02, ahora aplicable a más de un módulo, no solo MOC).
    confidence: high
    evidence_status: confirmed
    related_evidence_ids: []
    open_question_ids: ["OQ-GLOBAL-02"]

  - transformation_id: "etl_transform:simulacros.mapeotitulo.titlefix_cloneorigin_reference"
    workbook_id: "etl_workbook:simulacros.bcm_updateeje"
    sheet_id: "etl_sheet:simulacros.mapeo_titulo"
    source_columns: ["Titulo (implícito, no una columna SQL directa)"]
    target_column: "NameEN / NameFR / NameES / NameZH / NameBR / Reference"
    formula: >
      Fila2: ReglaEspecial=Titlefix sobre NameEN; NameFR/ES/ZH/BR=cloneorigin
      (fan-out); Reference=$=CONCATENAR(INDICE(J:J;FILA());"-";"HIST";"-";INDICE(AD:AD;FILA());"-";TEXTO(INDICE(K:K;FILA());"dd/mm/aaaa")).
      Fila3: DatoOrigen=NULL, ReglaEspecial=nullcontrol, Parametro="No name
      defined in historical data".
    transformation_type: "titlefix + cloneorigin (fan-out 5 idiomas, solo 4 aplicados aquí) + concatenación + nullcontrol"
    description: >
      Confirma el patrón de fan-out `cloneorigin` documentado en CLAUDE.md
      aplicado a NameFR/ES/ZH/BR desde NameEN, con `Titlefix` aplicado antes
      del clonado y un valor de reserva ('No name defined in historical
      data') para nombres nulos. La fórmula de 'Reference' referencia
      columnas del PROPIO sheet de salida (J, K, AD), no columnas del SQL
      origen directamente — ver limitations.
    confidence: high
    evidence_status: confirmed
    related_evidence_ids: []
    limitations:
      - "La fórmula de Reference varía entre hojas de salida sucesivas del mismo workbook (CSV_SIM_full, CSV_SIM, CSV_Generated_BCM_SIM, Export sim UAT) — ver traceability_catalog.yaml, trace_status=ambiguous para este campo específico."
    open_question_ids: []

  - transformation_id: "etl_transform:simulacros.mapeoestado.workflow_status_lookup"
    workbook_id: "etl_workbook:simulacros.bcm_updateeje"
    sheet_id: "etl_sheet:simulacros.mapeo_estado"
    source_columns: ["Estado"]
    target_column: "CS_WorkflowStatus"
    formula: "Lookup simple 1:1 (sin fórmula, tabla estática): Terminado→Validated, En Curso→Pending validation, Iniciado→Draft, Aprobado→Validated"
    transformation_type: "lookup_simple"
    description: >
      Traduce el estado de origen (español) al valor de workflow status de
      Enablon. Nótese que 'Terminado' y 'Aprobado' colapsan al mismo
      destino ('Validated') — no es una relación 1:1 estricta sino
      muchos-a-uno.
    confidence: high
    evidence_status: confirmed
    related_evidence_ids: []
    open_question_ids: []

  - transformation_id: "etl_transform:simulacros.mapeoestado_al.activity_status_lookup"
    workbook_id: "etl_workbook:simulacros.bcm_updateeje"
    sheet_id: "etl_sheet:simulacros.mapeo_estado_al"
    source_columns: ["Estado"]
    target_column: "Status (List of Activities)"
    formula: "Lookup simple 1:1: Terminado→Completed, En Curso→In Progress, Iniciado→In Progress, Aprobado→Not Started"
    transformation_type: "lookup_simple"
    description: >
      Traduce el MISMO campo origen ('Estado') que 'Mapeo_Estado', pero a un
      vocabulario de destino DISTINTO y con una correspondencia diferente
      (p. ej. 'Aprobado'→'Not Started' aquí, frente a 'Aprobado'→'Validated'
      en Mapeo_Estado). No se ha confirmado si esta diferencia es una
      decisión funcional deliberada (Drills y List of Activities son
      objetos Enablon distintos, con vocabularios de estado distintos) o un
      defecto de copia — clasificado como conflicting hasta confirmación.
    confidence: medium
    evidence_status: conflicting
    related_evidence_ids: []
    open_question_ids: ["OQ-OBJ-07"]

  - transformation_id: "etl_transform:simulacros.mapeotiposim.typology_two_step_lookup"
    workbook_id: "etl_workbook:simulacros.bcm_updateeje"
    sheet_id: "etl_sheet:simulacros.mapeo_tipo_sim"
    source_columns: ["IDTipo"]
    target_column: "CS_Typology"
    formula: >
      Paso 1: =_xlfn.XLOOKUP(A2,ITP_MAESTROS[IDMaestro],ITP_MAESTROS[Descripcion],"",0,1)
      (resuelve descripción vía tabla estructurada ITP_MAESTROS). Paso 2:
      =_xlfn.XLOOKUP(E2,I:I,F:F,"NADA",0,1) (resuelve código Enablon final,
      default "NADA" si no hay match).
    transformation_type: "lookup dinámico en 2 pasos"
    description: >
      Confirma con fórmula real el patrón "Lookup dinámico en 2 pasos"
      descrito en CLAUDE.md como preferible al lookup estático. Resuelve
      valores como PEI, PEI1, PEI2, PEISEG, GEN, EVA, INTT — visibles
      también en las cabeceras reales de Drills.csv (campo CS_Typology).
      Default explícito "NADA" (literal en español) cuando no hay
      coincidencia — no documentado en ningún otro lugar como valor
      esperado por Enablon.
    confidence: high
    evidence_status: confirmed
    related_evidence_ids: ["evidence:csv_enablon.drills"]
    open_question_ids: []

  - transformation_id: "etl_transform:simulacros.mapeoletra.letter_lookup_stale_label"
    workbook_id: "etl_workbook:simulacros.bcm_updateeje"
    sheet_id: "etl_sheet:simulacros.mapeo_letra"
