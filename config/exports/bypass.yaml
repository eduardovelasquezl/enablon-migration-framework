# Definición ejecutable de exportación — bypass.By_Passes (Sprint 9.4 —
# segundo módulo real del EMF, replicando el patrón de
# config/exports/drills.yaml).
#
# Alcance: incremento vertical mínimo, análogo al de Drills -- solo
# columnas con evidencia (a) SQL confirmada, (b) ETL/mapping confirmado
# vía las hojas MapeoBypass/Mapeo_*, o (c) cruzadas contra el CSV
# Operational real (`By pass new .bak.csv`). Ninguna columna se completó
# por analogía con Drills -- ver
# docs/07-developer-guide/bypass-module.md para la evidencia completa de
# cada regla.

object_id: bypass
module: bypass
migration_object: By_Passes
prototype_status: review_only

pipeline:
  stages: [query, transform_and_export]
  # Sin 'canonicalize'/'evidence' todavía -- Sprint 9.4 no las necesita
  # para BYPASS_OFFLINE_SAMPLE_READY (ver informe de este sprint,
  # clasificación MODULE_SPECIFIC / diferido, no CORE_GAP).

source:
  connection: prevencion
  # DOS candidatos SQL encontrados para el mismo objeto (ITP_BES),
  # estructuralmente distintos -- registrado como discrepancia, no
  # resuelto por adivinación (ver bypass-module.md § 2):
  #   - SQLQuery-dataset_BES.sql: INNER JOIN, sin ORDER BY, fechas crudas.
  #   - query_Bypass_prev2025.sql: FULL JOIN (5 tablas de dimensión),
  #     fechas formateadas, con ORDER BY, WHERE comentado.
  # Se elige la primera (INNER JOIN) por el mismo motivo ya documentado
  # en CLAUDE.md para el FULL JOIN de Eventos: un FULL JOIN sobre 5
  # tablas de dimensión arriesga inflar el recuento de filas con
  # combinaciones huérfanas -- no se puede descartar ese riesgo sin
  # ejecutar la consulta, que este sprint no autoriza. Ninguna de las
  # columnas de este contrato depende de las tablas JOINadas (todas usan
  # el IDxxx crudo + un lookup propio, no el texto ya unido por SQL) --
  # ver mappings más abajo.
  sql_file: "sql/source_queries/bypass/SQLQuery-dataset_BES.sql"
  max_rows: 2000000  # alineado con config/databases.yaml -> safety.max_rows_per_query

output:
  filename: bypass.csv
  encoding: utf-8
  bom: true  # CORREGIDO Micro-sprint 9.9.1 (antes: false). Este módulo es el origen del hallazgo: "PrevenciÃ³n.ITP_BES" en vez de "Prevención.ITP_BES" en CS_HistoricalDataOrigin -- confirmado byte a byte que EMF ya escribía UTF-8 correcto (\xc3\xb3), mojibake causado por abrir sin BOM (Causa B). Mismo Output Contract que Drills/Safety Meetings -- ver config/exports/drills.yaml y Informe-Micro-Sprint-9.9.1-Enablon-CSV-Output-Contract-EMF.md para la evidencia completa (no se repite aquí).
  delimiter: "\t"
  quoting: minimal
  line_terminator: "\r\n"
  include_header: true

invalid_row_policy: report_and_exclude_from_csv

# --------------------------------------------------------------------------
# Catálogos extraídos UNA VEZ de las hojas Mapeo_TipoBypass / Mapeo_CausaBypass
# / Mapeo_ElementType / Mapeo_RealizationMethods / NullControlException del
# ETL real (`ETL_Bypass_AjusteEntidadNEW_SITECAN.xlsx`), en modo solo
# lectura (data_only=True), Sprint 9.4. Cruzados contra los valores
# observados en el CSV Operational real (`By pass new .bak.csv`) como
# confirmación auxiliar -- nunca como sustituto del ETL.
# --------------------------------------------------------------------------
reference_data:
  # IDTipoBypass -> ByPassType (Mapeo_TipoBypass, 3 filas + 1 nullcontrol)
  bypass_type_lookup:
    1: "Operational"
    2: "Preventive Maintenance"
    3: "Non-Routine"
  bypass_type_null_default: "Null-not_relevant"  # literal exacto del nullcontrol de Mapeo_TipoBypass.

  # IDCausa -> Cause (Mapeo_CausaBypass, 5 filas + 1 nullcontrol) --
  # cruzado: {DF,IF,MF,OS,OT} ⊇ valores observados en el Operational real.
  cause_lookup:
    2: "DF"
    3: "IF"
    1: "MF"
    4: "OS"
    5: "OT"
  cause_null_default: "OT"  # literal exacto del nullcontrol de Mapeo_CausaBypass.

  # IDTipoSCE -> ElementType (Mapeo_ElementType, 8 filas mapeadas de 9
  # destinos posibles -- 'AL'/Alarm no tiene DatoOrigen asociado en el
  # ETL, se documenta tal cual, no se inventa) + 1 nullcontrol -- cruzado:
  # {OT,PA,MP,PSV,PSV_U,SCI,SIF,TR} ⊇ valores observados en el Operational real.
  element_type_lookup:
    7: "OT"
    6: "PA"
    2: "MP"
    4: "PSV"
    8: "PSV_U"
    3: "SCI"
    1: "SIF"
    5: "TR"
  element_type_null_default: "OT"  # literal exacto del nullcontrol de Mapeo_ElementType.

  # IDMetodoBypass -> RealizationMethods -- IMPORTANTE: el DatoDestino
  # real es un NÚMERO (no el código de letra 'PL'/'EPD'/... de la
  # columna 'InfoIgnore-clave', que -- como su nombre indica -- no se usa
  # en el mapeo real). Confirmado cruzando contra el Operational real:
  # sus valores observados son números ('2','3','4','5'), no letras.
  realization_method_lookup:
    2: 1
    3: 2
    1: 3
    5: 4
    4: 5
  realization_method_null_default: "Null value"  # literal exacto del nullcontrol de Mapeo_RealizationMethods -- SIC, tipo mixto (texto para un campo cuyo valor normal es numérico), no se corrige, se documenta tal cual.

  # Motivo -> Reason: sin tabla de lookup, solo nullcontrol genérico
  # (NullControlException) -- passthrough si no es nulo.
  reason_null_default: "Not specified in Migration Data Origin"

  historical_data_origin_literal: "Prevención.ITP_BES"
  # Verificado directamente en el CSV Operational real: valor único
  # observado en las 25 filas disponibles (no una inferencia del ETL).

fields:
  - source: "IDBES"
    target: "CS_HistoricalOriginID"
    required: true
    transformation: "to_historical_id"  # REUSED_AS_IS de src.export.prototype.drills.transformations -- función genérica, sin lógica específica de Drills.
    data_type: "string"
    date_format: null
    default: null
    mapping: null
    validation: "required_non_null"
    evidence_id: "etl:bypass.map_bes_fix.cloneorigin"

  - source: "IDTipoBypass"
    target: "ByPassType"
    required: false
    transformation: "resolve_lookup"  # mismo patrón que resolve_typology de Drills (reutilizado, no reimplementado).
    data_type: "string"
    date_format: null
    default: null
    mapping: "reference_data.bypass_type_lookup"
    validation: "warn_if_unresolved"
    evidence_id: "etl:bypass.mapeo_tipobypass"

  - source: "IDCausa"
    target: "Cause"
    required: false
    transformation: "resolve_lookup"
    data_type: "string"
    date_format: null
    default: null
    mapping: "reference_data.cause_lookup"
    validation: "warn_if_unresolved"
    evidence_id: "etl:bypass.mapeo_causabypass"

  - source: "IDTipoSCE"
    target: "ElementType"
    required: false
    transformation: "resolve_lookup"
    data_type: "string"
    date_format: null
    default: null
    mapping: "reference_data.element_type_lookup"
    validation: "warn_if_unresolved"
    evidence_id: "etl:bypass.mapeo_elementtype"

  - source: "IDMetodoBypass"
    target: "RealizationMethods"
    required: false
    transformation: "resolve_lookup"
    data_type: "string"
    date_format: null
    default: null
    mapping: "reference_data.realization_method_lookup"
    validation: "warn_if_unresolved"
    evidence_id: "etl:bypass.mapeo_realizationmethods"

  - source: "Motivo"
    target: "Reason"
    required: false
    transformation: "nullcontrol_passthrough"
    data_type: "string"
    date_format: null
    default: null  # default real vive en reference_data.reason_null_default.
    mapping: null
    validation: "warn_if_unresolved"
    evidence_id: "etl:bypass.nullcontrolexception"

  - source: null
    target: "CS_HistoricalDataOrigin"
    required: true
    transformation: "constant"
    data_type: "string"
    date_format: null
    default: "Prevención.ITP_BES"
    mapping: null
    validation: "constant_literal"
    evidence_id: "operational:bypass.by_pass_new_bak.cs_historicaldataorigin"

# --------------------------------------------------------------------------
# Columnas del CSV Operational real (43 en total) EXCLUIDAS de este
# incremento, con motivo explícito -- no exhaustivo de las 43 (mismo
# criterio que Drills: se documentan las exclusiones con evidencia real,
# no se completa la lista entera por sistema en un sprint acotado).
# --------------------------------------------------------------------------
excluded_columns:
  - column: "Entity"
    reason: >
      Mecanismo de resolución IDUnidadOrg -> Entity para el catálogo
      First_Axis VIGENTE (a diferencia de Drills, que usa el catálogo
      antiguo con IDUnidadOrg como columna directa) no está disponible
      localmente como artefacto reutilizable -- inputs/entity_catalog/
      catalogo_resuelto_code_ruta_site.csv y First_Axis_export_bruto.csv
      son catálogos SOLO de destino (Code/Ruta1/Centro), sin columna
      IDUnidadOrg de origen. El resultado (0% no catalogado) está
      validado en producción según CLAUDE.md/config/modules.yaml, pero
      el MECANISMO que lo produjo no es reproducible offline con lo
      disponible en este repositorio hoy. UNRESOLVED, no
      OUT_OF_SCOPE -- ver bypass-module.md § 4.
  - column: ["Equipment", "Tag"]
    reason: >
      'Equipment' requiere CharacterFix (mismo motor no documentado que
      Titlefix, ver CLAUDE.md) aplicado CONDICIONALMENTE (solo cuando
      TAG='OTH', según nota del propio ETL en MapeoBypass fila 18) --
      complejidad condicional no confirmada en este incremento. 'Tag'
      requiere Mapeo_Equipos_TAG, con una nota propia del ETL de que en
      Moeve es texto libre mientras en Enablon es una búsqueda
      controlada -- fidelidad de esa tabla no confirmada.
  - column: ["CS_HistoricalUserId", "CS_HistoricalUserName",
             "CS_HistoricalExecUserName", "CS_HistoricalAuthUserName"]
    reason: >
      Datos personales (nombre) -- confirmado directamente en el CSV
      Operational real (valores con nombre y apellido). Mismo criterio
      de alcance ya aplicado a Drills (OUT_OF_SCOPE_CONFIRMED).
  - column: "GOS"
    reason: >
      Confirmado en config/modules.yaml y en la nota propia del ETL
      (fila 58 de MapeoBypass): calculado automáticamente por Enablon al
      asociar un documento -- NO importable. SYSTEM_AUTOMATIC, no un
      hueco de evidencia.
  - column: ["Phase2ApprovalReason", "Phase3ApprovalReason",
             "Phase5ApprovalReason"]
    reason: >
      Confirmado no importable en config/modules.yaml
      (campos_no_importables_confirmados) y en las notas propias del ETL
      ("no importable" / "no es importable").
  - column: ["Phase2StartDate", "Phase3StartDate", "Phase4StartDate",
             "Phase5StartDate", "Phase6StartDate"]
    reason: >
      Confirmado no importable en config/modules.yaml
      (campos_no_importables_confirmados, "FechaEnvioFase1..6") -- el
      propio ETL anota que son campos de fecha de envío de fase, no
      visibles en Enablon.
  - column: "CS_HistoricalAttachedFiles"
    reason: >
      Fase transversal de adjuntos, misma exclusión que en Drills
      (fuera de alcance de un incremento vertical de un solo módulo).
  - column: "Description"
    reason: >
      Texto libre, sin regla de transformación confirmada en este
      incremento (no revisado a fondo, acotado por tiempo -- ver
      bypass-module.md § 5, UNRESOLVED_NON_BLOCKING).
